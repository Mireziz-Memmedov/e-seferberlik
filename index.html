<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" data-i18n="login.description" content="E-Səfərbərlik — səfərbərliklə bağlı məlumat və elektron xidmətlər portalı">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" defer></script>
    <script src="index.js" defer></script>
    <script src="dark-mode.js" defer></script>
    <script src="translation.js" defer></script>
    <script src="https://kit.fontawesome.com/51d2f8b0de.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <title data-i18n="login.title">Daxil ol | E-Səfərbərlik</title>
    <link rel="icon" href="Assets/seferberlik.png">
</head>

<body id="login-page">
    <header>
        <section id="login-header">
            <div class="container">
                <div class="row align-items-center justify-content-between">
                    <div class="col-auto"> <a href="index.html" class="brand">
                            <div class="brand-logo"> <img src="Assets/SF.png" alt="E-Səfərbərlik"> </div>
                            <div class="brand-text">
                                <h1 data-i18n="login.brand.name">E-Səfərbərlik</h1>
                                <p data-i18n="login.brand.subtitle">Elektron xidmət portalı</p>
                            </div>
                        </a> </div>
                    <div class="col-auto d-flex">
                        <button id="dark-mode-button" class="dark-mode-button" type="button">
                            <i class="fa-solid fa-moon"></i>
                        </button>
                        <nav class="language" aria-label="Dil seçimi">
                            <span class="active" data-i18n="login.language.az">AZ</span>
                            <span data-i18n="login.language.en">EN</span>
                            <span data-i18n="login.language.ru">RU</span>
                        </nav>
                    </div>
                </div>
            </div>
        </section>
    </header>
    <main>
        <section id="login">
            <div class="container">
                <div class="row justify-content-center align-items-center">
                    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                        <div class="login-card">
                            <div class="card-header">
                                <div class="card-icon" aria-hidden="true"> 🔐 </div>
                                <h2 data-i18n="login.card.title">Hesabınıza daxil olun</h2>
                                <p data-i18n="login.card.description"> Davam etmək üçün MyGov vasitəsilə daxil olun. </p>
                            </div> <button type="button" id="mygov-login"> <span class="button-icon" aria-hidden="true">
                                    🔐 </span> <span class="button-content"> <strong data-i18n="login.mygov.button"> MyGov ilə daxil ol </strong>
                                    <small data-i18n="login.mygov.security"> Təhlükəsiz giriş </small> </span> <span class="arrow" aria-hidden="true"> ❯
                                </span> </button>
                            <button type="button" id="guest-login">

                                <span class="button-icon" aria-hidden="true">
                                    🔓
                                </span>

                                <span class="button-content">
                                    <strong data-i18n="login.guest.button">Qeydiyyatsız davam et</strong>
                                </span>

                                <span class="arrow" aria-hidden="true">
                                    ❯
                                </span>

                            </button>
                            <button type="button" id="faq">

                                <span class="button-icon" aria-hidden="true">
                                    💡
                                </span>

                                <span class="button-content">
                                    <strong data-i18n="login.faq.button">Tez-tez verilən suallar</strong>
                                </span>

                                <span class="arrow" aria-hidden="true">
                                    ❯
                                </span>

                            </button>
                            <div class="security"> <span class="security-icon" aria-hidden="true"> 🔒 </span>
                                <p data-i18n="login.security.text"> Giriş məlumatlarınız təhlükəsiz şəkildə qorunur. </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <a href="chatbot.html" class="chatbot-button" aria-label="E-Səfərbərlik chatbot" data-i18n-aria-label="login.chatbot.ariaLabel">
            <span class="chatbot-icon" aria-hidden="true">
                <div class="imgbox">
                    <img src="Assets/chatbot.png" alt="">
                </div>
            </span>
        </a>

    </main>

    <footer>

    </footer>

</body>

</html>
