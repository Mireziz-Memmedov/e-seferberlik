<!DOCTYPE html>
<html lang="az">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="E-Səfərbərlik — virtual köməkçi">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" defer></script>
    <script src="chatbot.js" defer></script>
    <script src="https://kit.fontawesome.com/51d2f8b0de.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <title>E-Səfərbərlik | Virtual köməkçi</title>
    <link rel="icon" href="Assets/seferberlik.png">

</head>

<body>

    <main id="chatbot-page">

        <header id="chatbot-header">

            <div class="container">

                <div class="chatbot-header-content">

                    <a href="./index.html" class="logo">

                        <div class="imgbox">
                            <img src="Assets/SF.png" alt="E-Səfərbərlik">
                        </div>

                        <div class="text">
                            <h2>E-Səfərbərlik</h2>
                            <span>Virtual köməkçi</span>
                        </div>

                    </a>

                    <button type="button" class="back-button" id="back-button">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>

                </div>

            </div>

        </header>

        <!-- CHAT -->

        <section id="chatbot-section">

            <div class="container">

                <div class="chatbot-wrapper">

                    <!-- CHAT HEADER -->

                    <div class="chat-header">

                        <div class="chat-info">

                            <div class="chat-avatar">

                                <img src="Assets/chatbot.png" alt="Virtual köməkçi">

                            </div>

                            <div class="chat-text">

                                <h1>E-Səfərbərlik köməkçisi</h1>

                                <span>
                                    Suallarınızı cavablandırmağa hazıram
                                </span>

                            </div>

                        </div>

                    </div>

                    <!-- MESSAGES -->

                    <div class="chat-messages" id="chat-messages">

                        <!-- BOT MESSAGE -->

                        <div class="message bot-message">

                            <div class="message-avatar">

                                <img src="Assets/chatbot.png" alt="">

                            </div>

                            <div class="message-content">

                                <p>
                                    Salam! 👋
                                </p>

                                <p>
                                    Mən E-Səfərbərlik virtual köməkçisiyəm.
                                    Səfərbərliklə bağlı suallarınızı
                                    cavablandırmağa çalışacağam.
                                </p>

                            </div>

                        </div>

                    </div>

                    <!-- INPUT AREA -->

                    <div class="chat-input-wrapper">

                        <div class="chat-input">

                            <textarea id="chat-input" rows="1" placeholder="Sualınızı yazın..."
                                aria-label="Sualınızı yazın"></textarea>

                            <button type="button" id="send-message" aria-label="Mesajı göndər">
                                <i class="fa-solid fa-paper-plane"></i>
                            </button>

                        </div>

                        <p class="chat-notice">
                            Virtual köməkçinin cavabları məlumatlandırıcı
                            xarakter daşıyır.
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
